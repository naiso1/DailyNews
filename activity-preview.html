<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>交流機能・本番画面プレビュー</title>
  <style>
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; background:#050a12; font-family:"Noto Sans JP","Yu Gothic UI",sans-serif; }
    .prototype-toolbar { position:fixed; inset:0 0 auto; z-index:10; display:flex; height:58px; align-items:center; justify-content:space-between; gap:18px; padding:0 18px; border-bottom:1px solid rgba(199,157,255,.3); background:linear-gradient(100deg,#171426,#0d1c2b); color:#eef3fa; box-shadow:0 12px 35px rgba(0,0,0,.38); }
    .prototype-copy { min-width:0; }
    .prototype-copy strong { display:block; font-size:13px; }
    .prototype-copy span { display:block; margin-top:2px; overflow:hidden; color:#9ba9bb; font-size:10px; text-overflow:ellipsis; white-space:nowrap; }
    .prototype-actions { display:flex; flex:0 0 auto; align-items:center; gap:8px; }
    .prototype-button,.back-link { min-height:34px; border:1px solid rgba(255,255,255,.12); border-radius:999px; padding:0 13px; background:rgba(255,255,255,.045); color:#dbe4ef; font-size:11px; font-weight:700; text-decoration:none; cursor:pointer; }
    .prototype-button { border:0; background:linear-gradient(135deg,#c79dff,#6fa7ff); color:#09111d; }
    .prototype-button:disabled { opacity:.58; cursor:wait; }
    #productionFrame { position:fixed; inset:58px 0 0; width:100%; height:calc(100% - 58px); border:0; background:#050a12; }
    .loading { position:fixed; inset:58px 0 0; z-index:5; display:grid; place-items:center; background:#050a12; color:#8191a7; font-size:12px; }
    .loading.hidden { display:none; }
    .parent-toast { position:fixed; left:50%; bottom:22px; z-index:20; padding:10px 16px; border:1px solid rgba(125,241,194,.3); border-radius:999px; background:#14251f; color:#dffbef; font-size:12px; opacity:0; transform:translate(-50%,15px); pointer-events:none; transition:.25s; }
    .parent-toast.show { opacity:1; transform:translate(-50%,0); }
    @media(max-width:680px) { .prototype-toolbar{height:66px;padding:0 10px}.prototype-copy span{max-width:44vw}.back-link{display:none}#productionFrame,.loading{inset-block-start:66px;height:calc(100% - 66px)}.prototype-button{padding:0 10px} }
  </style>
</head>
<body>
  <header class="prototype-toolbar">
    <div class="prototype-copy"><strong>本番画面＋交流機能の完成イメージ</strong><span id="prototypeStatus">現行ページを一切省略せず、その上に新機能だけを重ねています。</span></div>
    <div class="prototype-actions"><button class="prototype-button" id="playDemo" type="button">コメント到着を再生</button><a class="back-link" href="http://IEWEB01/">本番へ戻る</a></div>
  </header>
  <div class="loading" id="loading">現行ページを読み込んでいます…</div>
  <iframe id="productionFrame" src="./?activity-preview-frame=1" title="内装製品デイリーニュース本番画面"></iframe>
  <div class="parent-toast" id="parentToast"></div>
  <script>
    const frame=document.getElementById("productionFrame");
    const loading=document.getElementById("loading");
    const playButton=document.getElementById("playDemo");
    const statusText=document.getElementById("prototypeStatus");
    const parentToast=document.getElementById("parentToast");
    let previewApi=null;

    function showParentToast(message){parentToast.textContent=message;parentToast.classList.add("show");clearTimeout(window.parentToastTimer);window.parentToastTimer=setTimeout(()=>parentToast.classList.remove("show"),2300)}
    function escapeHtml(value){return String(value??"").replace(/[&<>"']/g,(character)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"})[character])}
    function waitForPage(doc,selector,timeout=20000){return new Promise((resolve,reject)=>{const found=doc.querySelector(selector);if(found)return resolve(found);const observer=new MutationObserver(()=>{const element=doc.querySelector(selector);if(!element)return;observer.disconnect();resolve(element)});observer.observe(doc.documentElement,{childList:true,subtree:true});setTimeout(()=>{observer.disconnect();reject(new Error(`Timed out waiting for ${selector}`))},timeout)})}

    function addPreviewStyles(doc){
      const style=doc.createElement("style");style.id="activityPreviewStyles";style.textContent=`
        .activity-preview-bell{position:relative;display:grid;width:38px;height:38px;place-items:center;border:1px solid rgba(255,255,255,.12);border-radius:999px;background:rgba(255,255,255,.035);color:#e5edf6;font-size:16px;cursor:pointer}
        .activity-preview-count{position:absolute;top:-5px;right:-4px;display:grid;min-width:19px;height:19px;place-items:center;border:2px solid #101925;border-radius:10px;background:#ff6473;color:#fff;font-size:9px;font-weight:800}
        .activity-preview-bell.ring{animation:previewRing .8s ease 2}@keyframes previewRing{0%,100%{transform:rotate(0)}28%{transform:rotate(-13deg) scale(1.08)}70%{transform:rotate(11deg) scale(1.08)}}
        .activity-preview-rail{max-width:1400px;margin:0 auto 20px;padding:17px 18px;border:1px solid rgba(255,255,255,.08);border-radius:18px;background:rgba(16,22,35,.9);box-shadow:0 15px 40px rgba(0,0,0,.25)}
        .activity-preview-head{display:flex;align-items:flex-end;justify-content:space-between;gap:15px;margin-bottom:12px}.activity-preview-kicker{color:#7df1c2;font-size:9px;font-weight:800;letter-spacing:.14em}.activity-preview-head h2{margin:2px 0 0;color:#e9edf5;font-size:17px}.activity-preview-head p{margin:0;color:#8191a7;font-size:10px}
        .activity-preview-mine{border:1px solid rgba(111,167,255,.28);border-radius:999px;padding:6px 10px;background:rgba(111,167,255,.07);color:#a9c8ff;font-size:10px;cursor:pointer}.activity-preview-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
        .activity-preview-card{display:grid;grid-template-columns:68px minmax(0,1fr);gap:10px;min-width:0;padding:9px;border:1px solid rgba(255,255,255,.075);border-radius:13px;background:rgba(255,255,255,.025);cursor:pointer;transition:.2s ease}.activity-preview-card:hover{transform:translateY(-2px);border-color:rgba(111,167,255,.38);background:rgba(111,167,255,.055)}.activity-preview-card.arrive{border-color:rgba(125,241,194,.5);animation:previewArrive .65s cubic-bezier(.2,.8,.2,1)}@keyframes previewArrive{from{opacity:0;transform:translateY(-13px) scale(.97)}to{opacity:1;transform:none}}
        .activity-preview-card img{width:68px;height:68px;object-fit:cover;border-radius:9px;background:#1a2635}.activity-preview-meta{margin-bottom:2px;color:#8197b0;font-size:9px}.activity-preview-meta strong{color:#7df1c2}.activity-preview-card h3{margin:0;overflow:hidden;color:#eef3f8;font-size:11px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.activity-preview-card p{margin:4px 0 0;overflow:hidden;color:#a7b5c6;font-size:9px;text-overflow:ellipsis;white-space:nowrap}
        .activity-preview-drawer-bg{position:fixed;inset:0;z-index:10040;visibility:hidden;background:rgba(1,4,9,.54);opacity:0;transition:.25s}.activity-preview-drawer-bg.open{visibility:visible;opacity:1}.activity-preview-drawer{position:fixed;top:0;right:0;z-index:10041;width:min(410px,94vw);height:100vh;padding:19px;overflow:auto;border-left:1px solid rgba(111,167,255,.25);background:#0c1420;color:#e9edf5;box-shadow:-25px 0 70px rgba(0,0,0,.55);transform:translateX(105%);transition:.3s cubic-bezier(.22,.75,.25,1)}.activity-preview-drawer.open{transform:translateX(0)}
        .activity-preview-drawer-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}.activity-preview-drawer h2{margin:0;font-size:18px}.activity-preview-read{border:0;background:none;color:#8fb9ff;font-size:10px;cursor:pointer}.activity-preview-notice{position:relative;display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;margin-bottom:8px;padding:12px;border:1px solid rgba(111,167,255,.2);border-radius:12px;background:rgba(111,167,255,.065);cursor:pointer}.activity-preview-notice::after{position:absolute;top:14px;right:11px;width:6px;height:6px;border-radius:50%;background:#6fa7ff;content:""}.activity-preview-icon{display:grid;width:30px;height:30px;place-items:center;border-radius:9px;background:rgba(111,167,255,.1)}.activity-preview-notice p{margin:0;padding-right:8px;color:#c5d0de;font-size:11px;line-height:1.55}.activity-preview-notice time{display:block;margin-top:4px;color:#718299;font-size:9px}.activity-preview-note{color:#687b92;font-size:10px;line-height:1.6}
        .activity-preview-modal-bg{position:fixed;inset:0;z-index:10042;display:none;place-items:center;padding:18px;background:rgba(1,4,9,.72)}.activity-preview-modal-bg.open{display:grid}.activity-preview-modal{width:min(820px,100%);max-height:84vh;padding:20px;overflow:auto;border:1px solid rgba(111,167,255,.28);border-radius:18px;background:#101a27;color:#e9edf5;box-shadow:0 30px 90px rgba(0,0,0,.6)}.activity-preview-modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.activity-preview-modal h2{margin:0;font-size:18px}.activity-preview-close{border:0;background:none;color:#aab6c5;font-size:24px;cursor:pointer}.activity-preview-tabs{display:flex;gap:7px;margin-bottom:14px;overflow:auto}.activity-preview-tab{flex:0 0 auto;border:1px solid rgba(255,255,255,.09);border-radius:999px;padding:7px 11px;background:transparent;color:#98a7ba;font-size:10px}.activity-preview-tab.active{border-color:transparent;background:linear-gradient(135deg,#7df1c2,#6fa7ff);color:#07111d;font-weight:800}.activity-preview-row{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid rgba(255,255,255,.07);cursor:pointer}.activity-preview-row img{width:92px;height:62px;object-fit:cover;border-radius:9px;background:#1a2635}.activity-preview-row h3{margin:0 0 4px;font-size:12px}.activity-preview-row p{margin:0;color:#8fa0b4;font-size:9px}.activity-preview-unread{color:#7df1c2;font-size:9px;white-space:nowrap}.activity-preview-highlight{animation:previewHighlight 2.6s ease}@keyframes previewHighlight{0%,100%{box-shadow:none}20%,70%{box-shadow:0 0 0 4px rgba(125,241,194,.24),0 20px 50px rgba(0,0,0,.3)}}
        @media(max-width:760px){.activity-preview-grid{grid-template-columns:1fr}.activity-preview-head{align-items:flex-start;flex-direction:column}.activity-preview-head p{display:none}.activity-preview-card:nth-child(n+3){display:none}}
      `;doc.head.appendChild(style)
    }

    function selectItems(win){const all=Array.isArray(win.LOADED_NEWS_DATA)?win.LOADED_NEWS_DATA:[];const preferred=["eu1519","eu1520","eu1522"].map((id)=>all.find((item)=>item.id===id)).filter(Boolean);const withImages=[...all].reverse().filter((item)=>item.img&&item.title);return [...preferred,...withImages.filter((item)=>!preferred.includes(item))].slice(0,3)}
    function imageUrl(item){return String(item.img||"").replace(/&amp;/g,"&")}
    function createCard(doc,item,person,action,comment,arriving=false){const card=doc.createElement("article");card.className=`activity-preview-card${arriving?" arrive":""}`;card.dataset.itemId=item.id;card.innerHTML=`<img src="${escapeHtml(imageUrl(item))}" alt=""><div><div class="activity-preview-meta"><strong>${escapeHtml(person)}</strong>${escapeHtml(action)}</div><h3>${escapeHtml(item.title)}</h3><p>${escapeHtml(comment)}</p></div>`;card.querySelector("img").addEventListener("error",(event)=>{event.currentTarget.src="images/idea_1685.png"},{once:true});return card}

    function installPreview(doc,win,filters){
      addPreviewStyles(doc);const items=selectItems(win);if(!items.length)throw new Error("News data is not available.");
      const bell=doc.createElement("button");bell.className="activity-preview-bell";bell.type="button";bell.innerHTML=`🔔<span class="activity-preview-count">3</span>`;const accountSlot=doc.getElementById("accountHeaderSlot");(accountSlot?.parentElement||doc.querySelector(".header-top-actions"))?.insertBefore(bell,accountSlot||null);
      const rail=doc.createElement("section");rail.className="activity-preview-rail";rail.innerHTML=`<div class="activity-preview-head"><div><span class="activity-preview-kicker">RECENT ACTIVITY</span><h2>みんなの動き</h2></div><p>コメントが付いた過去記事を3件だけ表示。新着ニュースの並びは変えません。</p><button class="activity-preview-mine" type="button">参加した記事を見る</button></div><div class="activity-preview-grid"></div>`;filters.insertAdjacentElement("afterend",rail);
      const grid=rail.querySelector(".activity-preview-grid"),people=["田中さん","鈴木さんほか2名","開発企画グループ"],actions=["がコメント・12分前","が返信・34分前","で反響・1時間前"],comments=["後席まで含めた検知範囲が面白いです","あなたのコメントに新しい返信があります","コメント5件・いいね8件に増えました"];items.forEach((item,index)=>grid.appendChild(createCard(doc,item,people[index],actions[index],comments[index])));
      const drawerBg=doc.createElement("div");drawerBg.className="activity-preview-drawer-bg";const drawer=doc.createElement("aside");drawer.className="activity-preview-drawer";drawer.innerHTML=`<div class="activity-preview-drawer-head"><h2>通知</h2><button class="activity-preview-read" type="button">すべて既読にする</button></div><div class="activity-preview-notices"><article class="activity-preview-notice" data-item-id="${escapeHtml(items[1]?.id||items[0].id)}"><span class="activity-preview-icon">↩</span><div><p><strong>鈴木さん</strong>があなたのコメントに返信しました。</p><time>34分前</time></div></article><article class="activity-preview-notice" data-item-id="${escapeHtml(items[0].id)}"><span class="activity-preview-icon">💬</span><div><p>参加中の記事に<strong>新しいコメント</strong>があります。</p><time>42分前</time></div></article><article class="activity-preview-notice" data-item-id="${escapeHtml(items[2]?.id||items[0].id)}"><span class="activity-preview-icon">👍</span><div><p><strong>3人</strong>があなたのコメントにいいねしました。</p><time>1時間前</time></div></article></div><p class="activity-preview-note">自分への返信、参加中の記事、コメントへの反応を優先します。単純ないいねはまとめて表示します。</p>`;doc.body.append(drawerBg,drawer);
      const modalBg=doc.createElement("div");modalBg.className="activity-preview-modal-bg";modalBg.innerHTML=`<section class="activity-preview-modal"><div class="activity-preview-modal-head"><h2>中村 / マイページ</h2><button class="activity-preview-close" type="button">&times;</button></div><div class="activity-preview-tabs"><button class="activity-preview-tab active">参加した記事</button><button class="activity-preview-tab">返信があった記事</button><button class="activity-preview-tab">自分のコメント</button><button class="activity-preview-tab">お気に入り</button></div><div class="activity-preview-rows"></div></section>`;doc.body.appendChild(modalBg);
      const rows=modalBg.querySelector(".activity-preview-rows");items.forEach((item,index)=>{const row=doc.createElement("article");row.className="activity-preview-row";row.dataset.itemId=item.id;row.innerHTML=`<img src="${escapeHtml(imageUrl(item))}" alt=""><div><h3>${escapeHtml(item.title)}</h3><p>${index===0?"あなたのコメントに返信があります":"あなたがコメント・いいねした記事"}</p></div><span class="activity-preview-unread">${index===0?"● 未読":"更新あり"}</span>`;rows.appendChild(row)});
      const setDrawer=(open)=>{drawer.classList.toggle("open",open);drawerBg.classList.toggle("open",open)};
      const openItem=(itemId)=>{setDrawer(false);modalBg.classList.remove("open");if(typeof win.showNewsItem==="function")win.showNewsItem(itemId,true);setTimeout(()=>{const card=doc.getElementById(`card-${itemId}`)||doc.querySelector(`[data-news-id="${CSS.escape(itemId)}"]`);card?.scrollIntoView({behavior:"smooth",block:"center"});card?.classList.add("activity-preview-highlight");setTimeout(()=>card?.classList.remove("activity-preview-highlight"),2700)},250)};
      bell.addEventListener("click",()=>setDrawer(true));drawerBg.addEventListener("click",()=>setDrawer(false));drawer.querySelector(".activity-preview-read").addEventListener("click",()=>{drawer.querySelectorAll(".activity-preview-notice").forEach((notice)=>notice.style.background="rgba(255,255,255,.025)");bell.querySelector(".activity-preview-count").hidden=true});drawer.addEventListener("click",(event)=>{const notice=event.target.closest(".activity-preview-notice");if(notice)openItem(notice.dataset.itemId)});grid.addEventListener("click",(event)=>{const card=event.target.closest(".activity-preview-card");if(card)openItem(card.dataset.itemId)});rail.querySelector(".activity-preview-mine").addEventListener("click",()=>modalBg.classList.add("open"));modalBg.querySelector(".activity-preview-close").addEventListener("click",()=>modalBg.classList.remove("open"));modalBg.addEventListener("click",(event)=>{if(event.target===modalBg)modalBg.classList.remove("open")});rows.addEventListener("click",(event)=>{const row=event.target.closest(".activity-preview-row");if(row)openItem(row.dataset.itemId)});
      doc.addEventListener("click",(event)=>{const writeControl=event.target.closest('[onclick*="toggleLike"],[onclick*="toggleFavorite"],[onclick*="toggleIrrelevant"],.comment-submit,.comment-like-btn,.delete-btn');if(!writeControl)return;event.preventDefault();event.stopImmediatePropagation();showParentToast("テスト画面のため、いいね・コメントなどの書き込みは無効です")},true);
      return {runDemo:async()=>{const count=bell.querySelector(".activity-preview-count");count.hidden=false;count.textContent="4";bell.classList.remove("ring");void bell.offsetWidth;bell.classList.add("ring");const oldCards=[...grid.children],oldRects=new Map(oldCards.map((card)=>[card,card.getBoundingClientRect()]));const incoming=createCard(doc,items[0],"山田さん","がコメント・たった今","表皮とセンサーの組み合わせを試したいです",true);grid.prepend(incoming);oldCards.at(-1)?.remove();oldCards.slice(0,-1).forEach((card)=>{const before=oldRects.get(card),after=card.getBoundingClientRect();card.animate([{transform:`translate(${before.left-after.left}px,${before.top-after.top}px)`},{transform:"translate(0,0)"}],{duration:650,easing:"cubic-bezier(.2,.8,.2,1)"})});rail.querySelector(".activity-preview-head p").textContent="過去記事に新しいコメントが届き、先頭へ再浮上しました。";const notice=doc.createElement("article");notice.className="activity-preview-notice";notice.dataset.itemId=items[0].id;notice.innerHTML=`<span class="activity-preview-icon">💬</span><div><p><strong>山田さん</strong>が過去記事にコメントしました。</p><time>たった今</time></div>`;drawer.querySelector(".activity-preview-notices").prepend(notice);rail.scrollIntoView({behavior:"smooth",block:"center"});await new Promise((resolve)=>setTimeout(resolve,1500));setDrawer(true)}}
    }

    frame.addEventListener("load",async()=>{try{const doc=frame.contentDocument,win=frame.contentWindow,filters=await waitForPage(doc,".filters");previewApi=installPreview(doc,win,filters);loading.classList.add("hidden");statusText.textContent="現行のランキング・ニュース・考察・企画を残したまま、新機能だけを追加しています。"}catch(error){loading.textContent="本番ページへのログイン後、再読み込みしてください。";console.error(error)}});
    playButton.addEventListener("click",async()=>{if(!previewApi)return showParentToast("画面の読み込み完了までお待ちください");playButton.disabled=true;playButton.textContent="再生中…";statusText.textContent="新しいコメントを受信 → 過去記事を再浮上 → 通知を表示します。";await previewApi.runDemo();playButton.disabled=false;playButton.textContent="もう一度再生";statusText.textContent="通知内の記事を押すと、本番と同じニュースカードへ移動します。"});
  </script>
</body>
</html>
